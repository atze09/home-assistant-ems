set_manual:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: ems
          domain:
            - switch
            - number
            - select
          multiple: true
    value:
      required: false
      example: 100
      selector:
        number:
          min: 0
          max: 10000
          step: 1
          mode: box
    duration:
      required: false
      example: 60
      selector:
        number:
          min: 1
          max: 1440
          step: 1
          unit_of_measurement: min
          mode: box
set_auto:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: ems
          domain:
            - switch
            - number
            - select
          multiple: true
